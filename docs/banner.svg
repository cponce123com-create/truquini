<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">truquini</title>
  <desc id="banner-desc">Bóveda de credenciales cifrada en el navegador</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="40" r="180" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="120" cy="300" r="160" fill="#3b82f6" opacity="0.10"/>

  <g transform="translate(64,78)">
    <rect x="0" y="0" width="112" height="112" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/>
    <path d="M38 50V38a18 18 0 0 1 36 0v12" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <rect x="28" y="50" width="56" height="42" rx="10" fill="url(#accent)"/>
    <circle cx="56" cy="68" r="6" fill="#0f172a"/>
    <rect x="53" y="71" width="6" height="12" rx="3" fill="#0f172a"/>
  </g>

  <text x="208" y="142" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#f8fafc">truquini</text>
  <text x="210" y="186" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" fill="#cbd5e1">Bóveda de credenciales cifrada en el navegador</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="210" y="218" width="150" height="36" rx="18" fill="#0ea5e9" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="285" y="242" text-anchor="middle" fill="#7dd3fc">AES-256-GCM</text>
    <rect x="374" y="218" width="156" height="36" rx="18" fill="#22c55e" fill-opacity="0.12" stroke="#4ade80" stroke-opacity="0.4"/>
    <text x="452" y="242" text-anchor="middle" fill="#86efac">Zero-knowledge</text>
    <rect x="544" y="218" width="190" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="639" y="242" text-anchor="middle" fill="#c4b5fd">Auto-bloqueo 15 min</text>
  </g>

  <g transform="translate(940,50)">
    <path d="M110 0 L210 38 V128 C210 188 166 226 110 250 C54 226 10 188 10 128 V38 Z" fill="url(#shield)" stroke="url(#accent)" stroke-width="3"/>
    <path d="M110 22 L190 52 V128 C190 176 155 207 110 228 C65 207 30 176 30 128 V52 Z" fill="#07111f" fill-opacity="0.55"/>
    <circle cx="110" cy="118" r="28" fill="none" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="110" cy="118" r="10" fill="#38bdf8"/>
    <rect x="104" y="126" width="12" height="34" rx="6" fill="#38bdf8"/>
    <path d="M78 78h64" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
